# Sorabbyngo Edge OS — Runtime Configuration
OS_VARIANT=edge
OS_VERSION=1.0.0

# Edge device type
EDGE_TYPE=raspberry_pi  # raspberry_pi | drone | vehicle | sensor | robotics

# Minimal AI — Tier 1 only on edge
AI_TIER=1
TIER1_MODEL=phi4-mini
DEVICE_CONTROL_MODEL=smollm2:360m

# Byngonet mesh
BYNGONET_ENABLED=true
BYNGONET_TIER=T3_ARM32

# Minimal services — no full Django stack
NOVELA_MONITORS_ENABLED=true
CHAMEHA_ENABLED=true
BYNGOX_AGENTS=network_agent,health_agent

# Offline-first — edge devices may have no connectivity
OFFLINE_FIRST=true
SYNC_QUEUE_PATH=/var/lib/sorabbyngo/byngonet/sync_queue.jsonl

# Security — lightweight
CML_ENABLED=true
SENTINEL_ENABLED=true
CYBERWALL_ENABLED=true
CYBERWALL_MODE=monitor_only
